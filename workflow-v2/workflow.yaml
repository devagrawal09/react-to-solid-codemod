# Not this package's workflow: codemod.yaml runs src/workflow.ts.
#
# codemod 2.0.0-alpha.4 won't start a package from the registry unless it has
# a workflow.yaml (validate_package_structure in crates/core/src/registry.rs),
# even when codemod.yaml names a code-first workflow. This file only satisfies
# that check; delete it once a Codemod release drops the requirement.
version: "1"
nodes:
  - id: needs-workflow-v2
    name: Needs the codemod 2.0 alpha CLI
    type: automatic
    steps:
      - name: Explain
        run: echo "react-to-solid is a workflow v2 package; run it with npx codemod@alpha run react-to-solid"
